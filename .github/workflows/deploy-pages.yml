name: Deploy a GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build estático
        run: npm run build
        env:
          # basePath automático según el nombre del repositorio
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Endpoint de contenido (Apps Script, solo lectura). Las variables
          # NEXT_PUBLIC_* se incrustan en el bundle al compilar, así que sin
          # esto la web publicada se quedaría sin catálogo y caería siempre al
          # respaldo local. No es un secreto — es una Web App pública de
          # lectura, y su valor viaja igualmente al navegador.
          NEXT_PUBLIC_CONTENT_API_URL: https://script.google.com/macros/s/AKfycbx3s8FVdbV_KGF4fVlSkk5aBfNFVuDRLelO6ORY6Gps2YT5Fy__sSyMgxmtS03Sl1kt/exec

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
